[general]
import = ["colors.toml"]

[window]
opacity = 0.5
padding = {x=12, y=12}

[font]
size = 12
#while may seem redundant approach as compared to mapping
# bold = {family="", style=""}, it looked more cleaner to me

[font.normal]
family = "JetBrainsMono Nerd Font"

[font.bold]
family = "JetBrainsMono Nerd Font"

[font.italic]
family = "JetBrainsMono Nerd Font"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"

[cursor.style]
shape = "Beam"

[cursor.vi_mode_style]
shape = "Block"

[keyboard]
bindings = [
    { key = "v", mods = "Control", action = "Paste" },
    { key = "c", mods = "Control", action = "Copy" },
    { key = "C", mods = "Control|Shift", chars = "\x03"},
]

[env]
TERM = "xterm-256color"
