# Minimal Hyprland configuration for greetd greeter
# Runs the quickshell greeter, then exits Hyprland so greetd can launch the user session.

monitor = , preferred, auto, 1

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# Autostart quickshell greeter; when quickshell terminates upon login, Hyprland exits
exec-once = quickshell -p /etc/greetd/greeter/shell.qml; hyprctl dispatch exit
